# The book's own structure. Pages in _analysis/ fill it in; sections with no
# page yet render as gaps, which is the point -- the index is a progress map,
# not a list of what happens to exist.
#
# Sections without exercises (Abbott's "Discussion" openers and "Epilogue"
# closers) are left out. They would be gaps that never close.
#
# TITLES ARE FROM MEMORY OF THE 2ND EDITION AND NEED A PASS AGAINST YOUR COPY
# before this goes live. The numbering is the part that matters; the titles are
# decoration and a wrong one is embarrassing in a way a missing one is not.

book: Understanding Analysis
author: Stephen Abbott
edition: 2nd edition

chapters:
  - n: 1
    title: The Real Numbers
    sections:
      - { n: "1.2", title: Some Preliminaries }
      - { n: "1.3", title: The Axiom of Completeness }
      - { n: "1.4", title: Consequences of Completeness }
      - { n: "1.5", title: Cardinality }
      - { n: "1.6", title: Cantor's Theorem }
  - n: 2
    title: Sequences and Series
    sections:
      - { n: "2.2", title: The Limit of a Sequence }
      - { n: "2.3", title: The Algebraic and Order Limit Theorems }
      - { n: "2.4", title: The Monotone Convergence Theorem }
      - { n: "2.5", title: Subsequences and Bolzano-Weierstrass }
      - { n: "2.6", title: The Cauchy Criterion }
      - { n: "2.7", title: Properties of Infinite Series }
      - { n: "2.8", title: Double Summations and Products of Series }
  - n: 3
    title: Basic Topology of R
    sections:
      - { n: "3.2", title: Open and Closed Sets }
      - { n: "3.3", title: Compact Sets }
      - { n: "3.4", title: Perfect Sets and Connected Sets }
      - { n: "3.5", title: Baire's Theorem }
  - n: 4
    title: Functional Limits and Continuity
    sections:
      - { n: "4.2", title: Functional Limits }
      - { n: "4.3", title: Continuous Functions }
      - { n: "4.4", title: Continuous Functions on Compact Sets }
      - { n: "4.5", title: The Intermediate Value Theorem }
      - { n: "4.6", title: Sets of Discontinuity }
  - n: 5
    title: The Derivative
    sections:
      - { n: "5.2", title: Derivatives and the Intermediate Value Property }
      - { n: "5.3", title: The Mean Value Theorems }
      - { n: "5.4", title: A Continuous Nowhere-Differentiable Function }
  - n: 6
    title: Sequences and Series of Functions
    sections:
      - { n: "6.2", title: Uniform Convergence of a Sequence of Functions }
      - { n: "6.3", title: Uniform Convergence and Differentiation }
      - { n: "6.4", title: Series of Functions }
      - { n: "6.5", title: Power Series }
      - { n: "6.6", title: Taylor Series }
  - n: 7
    title: The Riemann Integral
    sections:
      - { n: "7.2", title: The Definition of the Riemann Integral }
      - { n: "7.3", title: Integrating Functions with Discontinuities }
      - { n: "7.4", title: Properties of the Integral }
      - { n: "7.5", title: The Fundamental Theorem of Calculus }
      - { n: "7.6", title: Lebesgue's Criterion for Riemann Integrability }
