---
layout: shell
---
<div id="vibes-canvas"></div>

<script>
(function () {
  var DATA_URL = "/assets/vibes/image_widths_heights.json";
  var IMG_BASE = "/assets/vibes/";
  var PADDING = 8;

  // Sizing follows guzey.com/vibes: pick the coarsest power-of-two reduction that
  // brings an image under a target display area. The quantized ladder is the whole
  // point — girl.surgery normalises every image to one exact area instead, and the
  // result reads as a grid. Here two images 20% apart in native resolution can land
  // a full rung, 4x in area, apart, which is what makes the canvas look scattered.
  var GOAL_AREA = 600 * 400;      // guzey's target display area
  var RUNGS = [1, 2, 4, 8];       // never upscale, never shrink past 1/8 of native

  function sizeFor(item, canvasW) {
    var area = item.width * item.height;
    var divisor = RUNGS[RUNGS.length - 1];
    for (var i = 0; i < RUNGS.length; i++) {
      if (area / (RUNGS[i] * RUNGS[i]) <= GOAL_AREA) { divisor = RUNGS[i]; break; }
    }

    // A weight is a readability override applied on top of whatever rung the image
    // landed on, so it stays a smooth knob rather than an all-or-nothing rung jump.
    // Rungs are 4x apart in area, so weight 4.0 is exactly one rung bigger.
    var scale = Math.sqrt(item.weight || 1) / divisor;
    var w = item.width * scale;
    var h = item.height * scale;

    var limit = canvasW - PADDING * 2;
    if (w > limit) { h *= limit / w; w = limit; }

    return { w: Math.round(w), h: Math.round(h) };
  }

  function rectsOverlap(a, b) {
    return !(
      a.x + a.w + PADDING <= b.x ||
      b.x + b.w + PADDING <= a.x ||
      a.y + a.h + PADDING <= b.y ||
      b.y + b.h + PADDING <= a.y
    );
  }

  function tryPlace(img, placed, canvasW) {
    var w = img.displayW;
    var h = img.displayH;
    var maxX = Math.max(0, canvasW - w);

    // Grow the search region up from a small window, the way guzey and girl.surgery
    // both do, instead of scattering across the whole canvas so far. Every image
    // tries the tightest region that could hold it first, so it fills gaps left by
    // earlier images rather than starting a new sparse row below them.
    var region = Math.max(600, h + PADDING);

    for (var round = 0; round < 400; round++) {
      for (var i = 0; i < 50; i++) {
        var candidate = {
          x: Math.floor(Math.random() * (maxX + 1)),
          y: Math.floor(Math.random() * (region - h + 1)),
          w: w,
          h: h
        };
        var ok = true;
        for (var j = 0; j < placed.length; j++) {
          if (rectsOverlap(candidate, placed[j])) { ok = false; break; }
        }
        if (ok) return candidate;
      }
      region += 50;
    }

    // Unreachable in practice; guarantees no image is ever silently dropped.
    var bottom = 0;
    for (var k = 0; k < placed.length; k++) {
      bottom = Math.max(bottom, placed[k].y + placed[k].h);
    }
    return { x: 0, y: bottom + PADDING, w: w, h: h };
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  fetch(DATA_URL)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var canvas = document.getElementById("vibes-canvas");
      var canvasW = canvas.offsetWidth || window.innerWidth;

      shuffle(data);
      data.forEach(function (item) {
        var size = sizeFor(item, canvasW);
        item.displayW = size.w;
        item.displayH = size.h;
      });

      // Place the largest first — packing the big pieces around small ones already
      // scattered across the canvas is what used to leave them homeless.
      var order = data.slice().sort(function (a, b) {
        return b.displayW * b.displayH - a.displayW * a.displayH;
      });

      var placed = [];
      var maxBottom = 0;

      order.forEach(function (item) {
        var pos = tryPlace(item, placed, canvasW);
        placed.push(pos);
        if (pos.y + pos.h > maxBottom) maxBottom = pos.y + pos.h;

        // Every image links somewhere: to its source if we know one, otherwise to
        // the file itself so dense screenshots stay readable at full resolution.
        var el = document.createElement("a");
        el.href = item.url || (IMG_BASE + item.filename);
        el.target = "_blank";
        el.rel = "noopener noreferrer";
        el.className = "vibes-item";
        el.style.position = "absolute";
        el.style.left = pos.x + "px";
        el.style.top = pos.y + "px";
        el.style.display = "block";

        var imgEl = document.createElement("img");
        imgEl.src = IMG_BASE + item.filename;
        imgEl.width = item.displayW;
        imgEl.height = item.displayH;
        imgEl.alt = item.filename;
        imgEl.loading = "lazy";
        el.appendChild(imgEl);
        canvas.appendChild(el);
      });

      canvas.style.height = (maxBottom + 40) + "px";
    })
    .catch(function (err) {
      console.error("vibes: failed to load image data", err);
    });
})();
</script>
