# Per-image size hints for the vibes page.
#
# Images are sized by a power-of-two ladder: each one is shown at 1/1, 1/2, 1/4 or 1/8
# of native resolution, whichever is the coarsest reduction that fits it under a common
# target area. The quantization is deliberate — it's what makes the page look scattered
# rather than gridded. Photos and big-text memes need nothing from this file.
#
# It cannot handle one thing: how big the *text* is inside the image. A 3000px photo of
# a poster with four words reads fine small; a 2200px spreadsheet doesn't read at any
# size that fits on a canvas. Pixel dimensions don't tell you which is which.
#
# The number here multiplies the display area after the rung is chosen. 1.0 is the
# default; 2.0 is twice the area (about 1.4x wider and taller); rungs are 4x apart in
# area, so 4.0 is exactly one rung bigger. Rough guide: dense table or chart 2.0-2.5,
# tweet or meme with small text 1.5-2.0, photo or big-text poster nothing at all.
# Prefer cropping dead space over a big number.
#
# After editing, run: uv run --with pillow lister.py

ftx_balance_sheet.png: 2.0
how_are_you.PNG: 2.3
