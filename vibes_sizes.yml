# Per-image size hints for the vibes page.
#
# Images are sized by a scale factor chosen to bring each one toward a common display
# area, bounded so nothing shrinks past 1/8 of native or gets upscaled past it. That
# handles photos and memes on its own.
#
# It cannot handle one thing: how big the *text* is inside the image. A 3000px photo of
# a poster with four words reads fine small; a 2200px spreadsheet doesn't read at any
# size that fits on a canvas. Pixel dimensions don't tell you which is which.
#
# The number here multiplies the target area for one image. 1.0 is the default, 2.0 is
# twice the area (about 1.4x wider and taller), 0.7 shrinks something that hogs
# attention. Rough guide: dense table or diagram 1.4-1.6, tweet or meme with small text
# 1.15-1.25, photo or big-text poster 1.0. Prefer cropping dead space over a big number.
#
# After editing, run: uv run --with pillow lister.py

ftx_balance_sheet.png: 1.6
payoff_table.JPG: 1.4
tiktok_coding.png: 1.25
i_dont_use_ai.JPG: 1.15
